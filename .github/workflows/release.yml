name: Release

# Publishes kinenix, kinenix-hub, and kinenix-worker together.
#   Push a tag such as v0.2.0b1      -> publish to PyPI
#   Run this workflow by hand        -> publish to TestPyPI, to try a release first
# Uses PyPI Trusted Publishing: no API token is stored in GitHub. See docs/releasing.md.
#
# Each package is published by its own job with its own environment (pypi, pypi-hub, pypi-worker and
# the testpypi equivalents). A job gets one OIDC token, and PyPI scopes it to the publisher that
# matches the job's environment; when one environment matches the publishers of several projects,
# for example an active one and a pending one, the token is valid for only one of them.
# kinenix is published first, so kinenix-hub and kinenix-worker never appear on an index before the
# kinenix version they require.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: |
          for package in kinenix-core kinenix-hub kinenix-worker; do
            python -m build --outdir dist "$package"
          done

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Check versions and tag
        run: python .github/scripts/check_release.py dist "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Separate the packages
        run: |
          mkdir -p split/kinenix split/kinenix-hub split/kinenix-worker
          mv dist/kinenix_hub-* split/kinenix-hub/
          mv dist/kinenix_worker-* split/kinenix-worker/
          mv dist/kinenix-* split/kinenix/
          test -z "$(ls dist)"
          ls -R split

      - uses: actions/upload-artifact@v4
        with:
          name: kinenix
          path: split/kinenix/

      - uses: actions/upload-artifact@v4
        with:
          name: kinenix-hub
          path: split/kinenix-hub/

      - uses: actions/upload-artifact@v4
        with:
          name: kinenix-worker
          path: split/kinenix-worker/

  testpypi:
    name: Publish kinenix to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kinenix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kinenix
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-extras:
    name: Publish ${{ matrix.package }} to TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: kinenix-hub
            environment: testpypi-hub
          - package: kinenix-worker
            environment: testpypi-worker
    environment:
      name: ${{ matrix.environment }}
      url: https://test.pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish kinenix to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kinenix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kinenix
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  pypi-extras:
    name: Publish ${{ matrix.package }} to PyPI
    needs: pypi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: kinenix-hub
            environment: pypi-hub
          - package: kinenix-worker
            environment: pypi-worker
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
