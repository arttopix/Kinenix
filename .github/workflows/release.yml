name: Release

# Publishes kinenix, kinenix-hub, and kinenix-worker together.
#   Push a tag such as v0.2.0b1      -> publish to PyPI
#   Run this workflow by hand        -> publish to TestPyPI, to try a release first
# Uses PyPI Trusted Publishing: no API token is stored in GitHub. See docs/releasing.md.
#
# kinenix-worker is published by its own job with its own environment (pypi-worker, testpypi-worker).
# PyPI refuses two pending publishers with the same repository, workflow, and environment, so a new
# project needs a configuration that no other pending publisher uses. It runs after the other two
# packages, so kinenix-worker never appears on an index before the kinenix version it requires.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: |
          for package in kinenix-core kinenix-hub kinenix-worker; do
            python -m build --outdir dist "$package"
          done

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Check versions and tag
        run: python .github/scripts/check_release.py dist "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Separate kinenix-worker
        run: |
          mkdir dist-worker
          mv dist/kinenix_worker-* dist-worker/
          ls dist dist-worker

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-worker
          path: dist-worker/

  testpypi:
    name: Publish kinenix and kinenix-hub to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kinenix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-worker:
    name: Publish kinenix-worker to TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi-worker
      url: https://test.pypi.org/project/kinenix-worker/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-worker
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish kinenix and kinenix-hub to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kinenix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  pypi-worker:
    name: Publish kinenix-worker to PyPI
    needs: pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi-worker
      url: https://pypi.org/project/kinenix-worker/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-worker
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
