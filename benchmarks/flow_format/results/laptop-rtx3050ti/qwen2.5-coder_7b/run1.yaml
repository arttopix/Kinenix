```yaml
name: Bank of Thailand Transfer Rates
description: Collects Bank of Thailand buying transfer rates for several currencies over one month and emails them as a CSV file.
variables:
  config:
    url: "https://www.banquet.co.th/en/rates"
    currencies: ["USD", "EUR", "JPY", "GBP"]
    month:
      date: "today"
      add_months: -1
    output_path: "./output/transfer_rates.csv"
    headless: true
    email:
      to: "recipient@example.com"
      subject: "Bank of Thailand Transfer Rates"
      body: "Attached are the transfer rates for the selected currencies."
      dry_run: false
  first_day: null
  last_day: null
  transfer_rates: []

steps:
  - name: Calculate First and Last Day of the Report Month
    action: date.calc
    with:
      date: "${config.month.date}"
      add_months: ${config.month.add_months}
      format: "yyyy-MM-dd"
    output_var: first_day

  - name: Calculate Last Day of the Report Month
    action: date.calc
    with:
      date: "${first_day}"
      add_months: 1
      add_days: -1
      format: "yyyy-MM-dd"
    output_var: last_day

  - name: Open Bank of Thailand Website
    action: web.open
    with:
      url: "${config.url}"
      headless: ${config.headless}
    on_error: retry
    max_retries: 2

  - name: Accept Cookie Banner
    action: web.click
    with:
      selector: "button[aria-label='Accept recommended cookies']"
    on_error: continue

  - name: Set Currency Filter
    action: web.select_option
    with:
      selector: "#dropdownCurrency"
      value: "${item}"
    on_error: retry
    max_retries: 2

  - name: Set Start Date
    action: web.select_option
    with:
      selector: ".react-datepicker select >> nth=1"
      value: "${first_day.split('-')[0]}"
    on_error: retry
    max_retries: 2

  - name: Set Start Month
    action: web.select_option
    with:
      selector: ".react-datepicker select >> nth=0"
      text: "${first_day.split('-')[1]}"
    on_error: retry
    max_retries: 2

  - name: Set Start Day
    action: web.click
    with:
      selector: ".react-datepicker__day--0${first_day.split('-')[2]}"
    on_error: retry
    max_retries: 2

  - name: Set End Date
    action: web.select_option
    with:
      selector: ".react-datepicker select >> nth=1"
      value: "${last_day.split('-')[0]}"
    on_error: retry
    max_retries: 2

  - name: Set End Month
    action: web.select_option
    with:
      selector: ".react-datepicker select >> nth=0"
      text: "${last_day.split('-')[1]}"
    on_error: retry
    max_retries: 2

  - name: Set End Day
    action: web.click
    with:
      selector: ".react-datepicker__day--0${last_day.split('-')[2]}"
    on_error: retry
    max_retries: 2

  - name: Search for Transfer Rates
    action: web.click
    with:
      selector: "button.historical-btn"
    on_error: retry
    max_retries: 2

  - name: Get Transfer Rates for Each Currency
    action: logic.loop
    with:
      items: ${config.currencies}
      item_var: currency
    steps:
      - name: Switch to Currency Tab
        action: web.click
        with:
          selector: "button.historical-btn[aria-label='${currency}']"
        on_error: retry
        max_retries: 2

      - name: Get Transfer Rates Table
        action: web.get_table
        with:
          selector: "table.currency-table"
          columns: ["Period", "Buying Rates Transfer"]
        output_var: table_data

      - name: Add Currency Column to Transfer Rates Table
        action: logic.loop
        with:
          items: ${table_data}
          item_var: row
        steps:
          - name: Add Currency to Row
            action: logic.append
            with:
              target: row
              item: {"Currency": "${currency}"}
            output_var: updated_row

        output_var: updated_table_data

      - name: Append Updated Table Data to Transfer Rates
        action: logic.append
        with:
          target: transfer_rates
          item: ${updated_table_data}

  - name: Write Transfer Rates to CSV
    action: csv.write
    with:
      file_path: "${config.output_path}"
      data: ${transfer_rates}
      columns: ["Currency", "Date", "Buying Transfer Rate"]
    on_error: retry
    max_retries: 2

  - name: Send Email with CSV Attachment
    action: email.send
    with:
      to: "${config.email.to}"
      subject: "${config.email.subject}"
      body: "${config.email.body}"
      attachments: ["${config.output_path}"]
      dry_run: ${config.email.dry_run}
    on_error: continue
```