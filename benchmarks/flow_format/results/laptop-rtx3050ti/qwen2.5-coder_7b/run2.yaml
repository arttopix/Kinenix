```yaml
name: Bank of Thailand Transfer Rates Report
description: Collects buying transfer rates for several currencies over one month and emails them as a CSV file.
variables:
  config:
    url: "https://www.boi.or.th"
    currencies: ["USD", "EUR", "JPY", "GBP"]
    month: {"date": "today", "add_months": -1}
    output_path: ./output/transfer_rates.csv
    headless: false
    email:
      to: "example@example.com"
      subject: "Bank of Thailand Transfer Rates Report"
      body: "Attached is the transfer rates report for the month."
      dry_run: false
steps:
  - name: Calculate Report Month
    action: date.calc
    with:
      date: "${config.month.date}"
      add_months: ${config.month.add_months}
      format: "%Y-%m-%d"
    output_var: report_month
  - name: Open BOI Website
    action: web.open
    with:
      url: ${config.url}
      headless: ${config.headless}
    output_var: browser
  - name: Accept Cookie Banner
    action: web.click
    with:
      selector: 'button[aria-label="Accept recommended cookies"]'
    on_error: continue
  - name: Set Currency Filter
    action: web.select_option
    with:
      selector: '#dropdownCurrency'
      value: ${config.currencies}
    on_error: continue
  - name: Set Start Date
    action: date.calc
    with:
      date: "${report_month}"
      format: "%Y-%m-01"
    output_var: start_date
  - name: Set End Date
    action: date.calc
    with:
      date: "${report_month}"
      add_months: 1
      add_days: -1
      format: "%Y-%m-%d"
    output_var: end_date
  - name: Select Start Date
    action: web.type
    with:
      selector: '.react-datepicker input'
      text: ${start_date}
  - name: Select End Date
    action: web.type
    with:
      selector: '.react-datepicker input'
      text: ${end_date}
  - name: Search
    action: web.click
    with:
      selector: 'button.historical-btn'
  - name: Collect Data
    action: logic.loop
    with:
      items: ${config.currencies}
      item_var: currency
    steps:
      - name: Select Currency Tab
        action: web.click
        with:
          selector: "button.${currency}"
      - name: Get Table Data
        action: web.get_table
        with:
          selector: 'table'
          columns: ["Period", "Buying Rates Transfer"]
          add_columns: {"Currency": "${currency}"}
        output_var: table_data
      - name: Append Data to Rows
        action: logic.append
        with:
          target: rows
          list_var: table_data
          extend: true
  - name: Write CSV File
    action: csv.write
    with:
      file_path: ${config.output_path}
      data: ${rows}
      columns: ["Currency", "Date", "Buying Transfer Rate"]
    on_error: retry
    max_retries: 2
  - name: Close Browser
    action: web.close
  - name: Send Email
    action: email.send
    with:
      to: ${config.email.to}
      subject: ${config.email.subject}
      body: ${config.email.body}
      attachments: ${config.output_path}
      dry_run: ${config.email.dry_run}
```