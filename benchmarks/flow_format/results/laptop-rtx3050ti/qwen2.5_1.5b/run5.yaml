name: Collect and Email Buy Transfer Rates for Thailand
variables:
  config: {}
  config.url: "https://www.bankofthailand.com/currency"
  config.currencies: ["THB", "USD", "JPY", "EUR", "AUD", "NZD"]
  config.month.date: "today"
  config.month.add_months: -1
  config.currencies: ["THB", "USD", "JPY", "EUR", "AUD", "NZD"]
  config.output_path: "/path/to/output/transfer_rates.csv"
  config.email.to: "you@example.com"
  config.email.subject: "Buy Transfer Rates for Thailand"
  config.email.body: "Please find attached the buy transfer rates for Thailand."
  config.email.dry_run: false

steps:
  - name: Determine Report Month
    action: logic.set_variable
    with:
      name: config.month
      value: ${config.url}

  - name: Accept Cookies
    action: web.check
    with:
      selector: body
      label: "Accept recommended cookies"
      timeout: 15

  - name: Open Currency Filter
    action: web.open
    with:
      url: ${config.url}
      headless: false

  - name: Select Currencies
    action: logic.set_variable
    with:
      name: config.currencies
      value: ${config.currencies}

  - name: Set Dates
    action: logic.set_variable
    with:
      name: config.month
      value: ${config.month.date}
      name: config.month.add_months
      value: ${config.month.add_months}

  - name: Pick Start and End Dates
    action: logic.set_variable
    with:
      name: config
      value: ${config}

  - name: Search for Rates
    action: web.get_table
    with:
      selector: "button.historical-btn"
      columns: "Period Date Buying Transfer Rate"
      min_rows: 1
      timeout: 15
      response_timeout: 15

  - name: Process Currencies
    action: logic.set_variable
    with:
      name: config
      value: ${config}

  - name: Write to CSV
    action: csv.write
    with:
      file_path: ${config.output_path}
      data: ${config}
      columns: "Currency Date Buying Transfer Rate"
      append: true
      encoding: utf-8

  - name: Close Browser and Send Email
    action: flow.call
    with:
      flow: email.send
      inputs:
        to: ${config.email.to}
        cc: []
        bcc: []
        subject: ${config.email.subject}
        body: ${config.email.body}
        html: false
        attachments: []
        smtp_host: "smtp.example.com"
        smtp_port: 587
        smtp_user: "email@example.com"
        smtp_password: "password"
        use_tls: true
        dry_run: ${config.email.dry_run}