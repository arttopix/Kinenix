      input_format: "%Y-%m-%d"
      add_months: ${config.month_add_months}
      add_days: 0
      add_weeks: 0
      add_years: 0
      snap: False
      format: "%Y-%m-%d"
    output_var: first_day_of_month
    on_error: continue
    max_retries: 2
    steps:
      - name: Work out the first and last day of the report month (retry)
        action: date.calc
        with:
          date: ${config.month_date}
          input_format: "%Y-%m-%d"
          add_months: ${config.month_add_months}
          add_days: 0
