[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinenix"
version = "0.1.0b1"
description = "Core execution engine and standard action libraries for Kinenix RPA platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
kinenix = "kinenix.cli:main"

[tool.setuptools.packages.find]
include = ["kinenix*"]


