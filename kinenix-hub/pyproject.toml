[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinenix-hub"
dynamic = ["version"]
description = "Kinenix Hub: central server that receives worker heartbeats and execution logs, with a web dashboard and AI failure summaries"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "arttopix" }]
keywords = ["rpa", "automation", "dashboard", "telemetry", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
    "Topic :: Office/Business",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    # The `kinenix hub` command lives in kinenix-core
    "kinenix>=0.3.0b1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://github.com/arttopix/kinenix"
Documentation = "https://github.com/arttopix/kinenix/blob/main/docs/hub.md"
Issues = "https://github.com/arttopix/kinenix/issues"

[tool.setuptools.dynamic]
version = { attr = "kinenix_hub.__version__" }

[tool.setuptools.packages.find]
include = ["kinenix_hub*"]

[tool.setuptools.package-data]
kinenix_hub = ["static/*", "hub_data.md"]
