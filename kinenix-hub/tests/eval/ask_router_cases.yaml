# Evaluation cases for the "ask" router: OpenThai-SystemOne picks a tool and its
# parameters from a free-form Thai (or mixed Thai/English) question.
#
# Labels
#   tool:
#     search_executions     list runs in a time window, optionally filtered by status
#     get_execution_detail  explain why a specific run failed and how to fix it
#     get_flow_history      trend of one flow over time (how often it fails, since when)
#     get_worker_status     current state of worker machines (online, offline, busy)
#     find_missed_runs      scheduled runs that should have happened but did not
#     unrelated             not about jobs or workers
#   status:   failed | success
#             There is no "all" option; a question that does not ask about an outcome
#             leaves status unscored.
#   window:   last_hour | last_night | today | yesterday | last_7_days | custom
#             last_night = 18:00 yesterday to 08:00 today (Asia/Bangkok)
#             today      = 00:00 today until now
#             yesterday  = 00:00 to 24:00 yesterday
#             custom     = an explicit clock range in the question; parsed outside SystemOne
#   flow:     a flow name from the database; omitted means any flow
#   ask_back: true when the question is too vague and the router should ask a clarifying question
#
# A field that is absent from `expect` is not scored for that case.
#
# Splits
#   tune     use while adjusting option descriptions (30 cases)
#   holdout  do not look at while tuning; run once to report final accuracy (20 cases)

# ---------------------------------------------------------------------------
# tune
# ---------------------------------------------------------------------------

# search_executions: status and window combinations
- id: t01
  split: tune
  q: "เมื่อคืนมี job ไหนพังบ้าง"
  expect: {tool: search_executions, status: failed, window: last_night}

- id: t02
  split: tune
  q: "เมื่อคืนมีอะไรรันผ่านบ้าง"
  note: "Same window as t01 but asks for successes; catches a bias toward failed"
  expect: {tool: search_executions, status: success, window: last_night}

- id: t03
