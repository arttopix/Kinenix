[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinenix-orchestrator"
version = "0.1.0a1"
description = "Central telemetry server, dashboard, and AI failure summaries for Kinenix"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
include = ["kinenix_orchestrator*"]

[tool.setuptools.package-data]
kinenix_orchestrator = ["static/*"]
