[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinenix-studio"
version = "0.1.0a1"
description = "Developer Studio, Step Inspector, and Live Debugger for Kinenix"
requires-python = ">=3.10"
dependencies = [
    "kinenix>=0.1.0b1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
kinenix-studio = "kinenix_studio.cli:main"

[tool.setuptools.packages.find]
include = ["kinenix_studio*"]
