[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinenix-worker"
version = "0.1.0a1"
description = "Unattended worker robot daemon and edge runner for Kinenix"
requires-python = ">=3.10"
dependencies = [
    "kinenix>=0.1.0b1",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
kinenix-worker = "kinenix_worker.cli:main"

[tool.setuptools.packages.find]
include = ["kinenix_worker*"]
